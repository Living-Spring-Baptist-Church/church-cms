# Pull request gate (LBC-15). Free GitHub-hosted runners only, no secrets, no paid services.
# The job names below ("Verify", "Secret scan") are the required status checks of branch
# protection on main (see README, "Continuous integration"). Renaming one breaks that rule.
#
# Actions are pinned by full commit SHA, with the release tag in the comment, so a moved or
# hijacked tag cannot change what runs. Bump them deliberately, never automatically.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # package.json allows node >=24.19.0, which would float to Node 26 here. Pin the supported major.
  NODE_VERSION: "24"
  # Corepack picks pnpm from the packageManager field of package.json; never prompt in CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Everything except the database: pgTAP and the schema export only need Postgres.
  SUPABASE_EXCLUDED_SERVICES: gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
  # Pinned gitleaks binary. The gitleaks-action needs a paid license key for organisation repos.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Start the local database
        run: pnpm db:start -x "$SUPABASE_EXCLUDED_SERVICES"

      - name: Verify (format, lint, em dashes, types, tests, duplicates, pgTAP, generated files)
        run: pnpm verify

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned gitleaks release
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan the history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose'

  # Fails on a high or critical production advisory. Not a required check yet: the tech lead decides
  # whether to add it to branch protection (README, "Continuous integration").
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
